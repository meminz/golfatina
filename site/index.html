<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Round Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1>Round Results</h1>
    <p class="tagline">Every finished round, pulled straight off the tape.</p>
  </div>
</header>

<main id="app">
  <section id="latest-round" class="latest hidden" aria-label="Most recent round">
    <span class="latest-label">Latest round</span>
    <div class="latest-card">
      <div class="latest-map"></div>
      <div class="latest-meta"></div>
      <ol class="latest-standings"></ol>
    </div>
  </section>

  <section class="controls">
    <label for="channel-filter">Channel</label>
    <select id="channel-filter">
      <option value="">All channels</option>
    </select>
    <input id="search" type="search" placeholder="Search map or player…" aria-label="Search" />
  </section>

  <section id="round-list" class="round-list" aria-label="All rounds"></section>

  <p id="empty-state" class="empty-state hidden">
    No rounds recorded yet — check back after the next upload.
  </p>
</main>

<footer class="site-footer">
  <p>Updated automatically from new YouTube uploads.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
